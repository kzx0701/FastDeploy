[package]
name = "FastDeploy"
version = "1.6.0"
description = "Desktop workbench for front-end build and deployment with OpenClaw"
authors = ["Codex"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "claw_deploy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
libc = "0.2"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }
tauri = { version = "2.0.0", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7.1"
wait-timeout = "0.2"
window-vibrancy = "0.7"
